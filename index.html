<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Contributors Gizleme Rehberi</title>
    <meta name="description" content="GitHub Insights'ta contributor kısmından bir kullanıcıyı gizleme yöntemleri" />
    <meta name="theme-color" content="#f97316" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>" />
    <link rel="manifest" href="/manifest.json" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
      html.light, html.light body { background-color: #fafafa !important; color: #1a1a1a; }
      html.dark, html.dark body { background-color: #0f0f0f !important; color: #f5f5f5; }
    </style>
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('focus_app_theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.add('light');
          }
        } catch(e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
